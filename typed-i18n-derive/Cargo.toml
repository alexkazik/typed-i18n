[package]
name = "typed-i18n-derive"
version = "1.0.0"
authors = ["ALeX Kazik <alex@kazik.de>"]
edition = "2024"
description = "Derive macro for typed-i18n"
repository = "https://github.com/alexkazik/typed-i18n"
license = "MIT"
keywords = []
categories = []
readme = "README.md"
rust-version = "1.85.0"

[lib]
proc-macro = true

[dependencies]
proc-macro-error = { version = "1.0.4", default-features = false }
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
typed-i18n-support = { version = "=1.0.0", path = "../typed-i18n-support", default-features = false }

[features]
default = ["alloc", "json", "yaml"]
alloc = []
json = ["typed-i18n-support/json"]
yaml = ["typed-i18n-support/yaml"]
